<style>*{box-sizing:border-box;margin:0}html,body{height:100%}body{font:13px/1.4 system-ui,-apple-system,sans-serif;color:#555;background:#f3f3f1;overflow-y:auto;overflow-x:hidden}.bar{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#f3f3f1;border-bottom:1px solid #e0e0dc}.bk,.mn{font-size:11px;color:#777}.mark{font:italic 20px Georgia,serif;color:#333}.wrap{padding:14px 16px 28px}h1{font:italic 34px Georgia,serif;color:#333;font-weight:normal}.sub{font-size:11px;color:#888;margin:2px 0 12px}.chips{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}.chips button{font:12px system-ui;border:1px solid #c8c8c2;background:#fff;color:#555;border-radius:14px;padding:5px 12px;cursor:pointer}.chips button.on{background:#333;color:#fff;border-color:#333}.grid{column-count:2;column-gap:10px}.t{break-inside:avoid;margin:0 0 10px;border:0;padding:0;background:none;font:inherit;text-align:left;border-radius:2px;cursor:pointer;position:relative;display:block;width:100%}.t.pol{background:#fbfbf9;padding:8px 8px 28px;box-shadow:0 1px 2px rgba(0,0,0,.14)}.im{display:block;height:0;width:100%;border-radius:1px}.t small{position:absolute;left:8px;bottom:6px;font-size:9px;color:#888;letter-spacing:.05em;text-transform:uppercase}.t:not(.pol) small{color:#fff}.foot{margin-top:20px;font-size:11px;color:#888;border-top:1px solid #e0e0dc;padding-top:10px}.v{position:fixed;inset:0;background:#141413;z-index:20;display:none;flex-direction:column;color:#ddd;touch-action:pan-y}.v.open{display:flex}.vt{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;font-size:12px;color:#aaa}.vt button{background:none;border:0;color:#ddd;font-size:20px;cursor:pointer;line-height:1}.stage{flex:1;position:relative;overflow:hidden}.slide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transition:transform .35s ease,opacity .35s ease}.big{border-radius:2px}.big.pol{background:#fbfbf9;padding:12px 12px 44px}.cap{text-align:center;font-size:12px;color:#aaa;padding:12px 14px 6px}.hint{text-align:center;font-size:10px;color:#666;padding-bottom:14px;letter-spacing:.05em;text-transform:uppercase}.nav{position:absolute;top:0;bottom:0;width:30%;background:none;border:0;cursor:pointer;z-index:2}.nav.l{left:0}.nav.r{right:0}button:focus-visible{outline:2px solid #888;outline-offset:2px}@media (prefers-reduced-motion:reduce){.slide{transition:none}}</style>

<body>
<div class='bar'><a class='bk' href='/creations'>← Creations</a><a class='mark' href='/'>saintmereh</a><button type='button' class='mn' data-menu>menu</button></div><div class='wrap'><h1>Photography</h1><div class='sub'>all taken by me · newest first</div><div class='chips' id='ch'></div><div class='grid' id='g'></div><div class='foot'><a href='/apps'>Next: Apps →</a><div class='fl'><a data-ig target='_blank' rel='noopener' href='#'>Instagram</a> · <a data-lb target='_blank' rel='noopener' href='#'>Letterboxd</a></div></div></div><div class='v' id='v'><div class='vt'><span id='ct'></span><button type='button' id='x' aria-label='Close'>✕</button></div><div class='stage' id='sg'><button type='button' class='nav l' id='pv' aria-label='Previous'></button><div class='slide' id='sl'></div><button type='button' class='nav r' id='nx' aria-label='Next'></button></div><div class='cap' id='cp'></div><div class='hint'>swipe or tap the sides</div></div>
<script src='/assets/site.js'></script>
<script>var K={pol:'Polaroid',film:'Film',dig:'Digital'};var spec=[['pol',1],['film',.667],['dig',1.33],['film',1.5],['pol',1],['dig',.75],['dig',1.25],['film',.667],['pol',1],['film',1.5],['dig',.8],['pol',1],['dig',1.33],['film',.667],['pol',1],['dig',1.2],['film',1.5],['dig',.75]];var items=spec.map(function(s,i){return{k:s[0],r:s[1],g:60+((i*37)%28)};});var f='all',list=[],cur=0,skip=false;var g=document.getElementById('g'),ch=document.getElementById('ch'),v=document.getElementById('v'),sl=document.getElementById('sl'),sg=document.getElementById('sg'),ct=document.getElementById('ct'),cp=document.getElementById('cp');[['all','All'],['pol','Polaroid'],['film','Film'],['dig','Digital']].forEach(function(c){var b=document.createElement('button');b.type='button';b.textContent=c[1];if(c[0]==='all')b.className='on';b.addEventListener('click',function(){f=c[0];Array.prototype.forEach.call(ch.children,function(x){x.className='';});b.className='on';render();});ch.appendChild(b);});function shade(it){return 'hsl(35,6%,'+it.g+'%)';}function render(){while(g.firstChild)g.removeChild(g.firstChild);list=items.filter(function(it){return f==='all'||it.k===f;});list.forEach(function(it,i){var t=document.createElement('button');t.type='button';t.className='t'+(it.k==='pol'?' pol':'');var im=document.createElement('span');im.className='im';im.style.paddingTop=(it.r*100)+'%';im.style.background=shade(it);t.appendChild(im);var s=document.createElement('small');s.textContent=K[it.k];t.appendChild(s);t.addEventListener('click',function(){cur=i;v.classList.add('open');show(0);});g.appendChild(t);});}function show(dir){var it=list[cur];while(sl.firstChild)sl.removeChild(sl.firstChild);var pad=it.k==='pol'?56:0;var sw=sg.clientWidth-40,sh=sg.clientHeight-40-pad;var w=Math.min(sw,sh/it.r),h=w*it.r;var b=document.createElement('div');b.className='big'+(it.k==='pol'?' pol':'');var im=document.createElement('div');im.style.width=w+'px';im.style.height=h+'px';im.style.background=shade(it);b.appendChild(im);sl.appendChild(b);ct.textContent=(cur+1)+' / '+list.length;cp.textContent=K[it.k]+' · year · a few words (optional)';if(dir){sl.style.transition='none';sl.style.transform='translateX('+(dir*60)+'px)';sl.style.opacity='0';void sl.offsetWidth;sl.style.transition='';sl.style.transform='none';sl.style.opacity='1';}}function go(d){cur=(cur+d+list.length)%list.length;show(d);}document.getElementById('nx').addEventListener('click',function(){if(skip){skip=false;return;}go(1);});document.getElementById('pv').addEventListener('click',function(){if(skip){skip=false;return;}go(-1);});document.getElementById('x').addEventListener('click',function(){v.classList.remove('open');});var x0=null;sg.addEventListener('pointerdown',function(e){x0=e.clientX;});sg.addEventListener('pointerup',function(e){if(x0===null)return;var dx=e.clientX-x0;x0=null;if(Math.abs(dx)>40){skip=true;setTimeout(function(){skip=false;},350);go(dx<0?1:-1);}});document.addEventListener('keydown',function(e){if(!v.classList.contains('open'))return;if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1);if(e.key==='Escape')v.classList.remove('open');});render();</script>
