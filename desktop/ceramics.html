<script>var items=[["a pot", 1.25], ["a mug", 0.8], ["a vase", 1.4], ["a bowl", 1.0], ["a plate", 1.3], ["a cup", 0.75], ["a dish", 1.2], ["a pot", 1.5], ["a vase", 0.9], ["a mug", 1.1]].map(function(x,i){return{l:x[0],r:x[1],g:60+((i*37)%26)};});var cap="title \u00b7 year \u00b7 made for \u2026";var cur=0;var g=document.getElementById('g'),v=document.getElementById('v'),bg=document.getElementById('bg');function shade(it){return 'hsl(35,5%,'+it.g+'%)';}items.forEach(function(it,i){var t=document.createElement('button');t.type='button';t.className='t';var im=document.createElement('span');im.className='im';im.style.paddingTop=(it.r*100)+'%';im.style.background=shade(it);t.appendChild(im);var s=document.createElement('small');s.textContent=it.l;t.appendChild(s);t.addEventListener('click',function(){cur=i;v.classList.add('open');show();});g.appendChild(t);});function show(){var it=items[cur];var h=Math.min(window.innerHeight*0.72,560);var w=h/it.r;if(w>window.innerWidth*0.6){w=window.innerWidth*0.6;h=w*it.r;}bg.style.width=w+'px';bg.style.height=h+'px';bg.style.background=shade(it);document.getElementById('ct').textContent=(cur+1)+' / '+items.length;document.getElementById('cp').textContent=it.l+' \u00b7 '+cap;}function go(d){cur=(cur+d+items.length)%items.length;show();}document.getElementById('nx').addEventListener('click',function(){go(1);});document.getElementById('pv').addEventListener('click',function(){go(-1);});document.getElementById('x').addEventListener('click',function(){v.classList.remove('open');});document.addEventListener('keydown',function(e){if(!v.classList.contains('open'))return;if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1);if(e.key==='Escape')v.classList.remove('open');});</script>
