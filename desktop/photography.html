<script>var K={pol:'Polaroid',film:'Film',dig:'Digital'};var spec=[['pol',1],['film',.667],['dig',1.33],['film',1.5],['pol',1],['dig',.75],['dig',1.25],['film',.667],['pol',1],['film',1.5],['dig',.8],['pol',1],['dig',1.33],['film',.667],['pol',1],['dig',1.2]];var items=spec.map(function(s,i){return{k:s[0],r:s[1],g:60+((i*37)%28)};});var f='all',list=[],cur=0;var g=document.getElementById('g'),ch=document.getElementById('ch'),v=document.getElementById('v'),bg=document.getElementById('bg');[['all','All'],['pol','Polaroid'],['film','Film'],['dig','Digital']].forEach(function(c){var b=document.createElement('button');b.type='button';b.textContent=c[1];if(c[0]==='all')b.className='on';b.addEventListener('click',function(){f=c[0];Array.prototype.forEach.call(ch.children,function(x){x.className='';});b.className='on';render();});ch.appendChild(b);});function shade(it){return 'hsl(35,5%,'+it.g+'%)';}function render(){while(g.firstChild)g.removeChild(g.firstChild);list=items.filter(function(it){return f==='all'||it.k===f;});list.forEach(function(it,i){var t=document.createElement('button');t.type='button';t.className='t'+(it.k==='pol'?' pol':'');var im=document.createElement('span');im.className='im';im.style.paddingTop=(it.r*100)+'%';im.style.background=shade(it);t.appendChild(im);var s=document.createElement('small');s.textContent=K[it.k];t.appendChild(s);t.addEventListener('click',function(){cur=i;v.classList.add('open');show();});g.appendChild(t);});}function show(){var it=list[cur];var h=Math.min(440,560/it.r*it.r);var w=h/it.r;if(w>560){w=560;h=w*it.r;}bg.style.width=w+'px';bg.style.height=h+'px';bg.style.background=shade(it);document.getElementById('ct').textContent=(cur+1)+' / '+list.length;document.getElementById('cp').textContent=K[it.k]+' · year · a few words';}function go(d){cur=(cur+d+list.length)%list.length;show();}document.getElementById('nx').addEventListener('click',function(){go(1);});document.getElementById('pv').addEventListener('click',function(){go(-1);});document.getElementById('x').addEventListener('click',function(){v.classList.remove('open');});document.addEventListener('keydown',function(e){if(!v.classList.contains('open'))return;if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1);if(e.key==='Escape')v.classList.remove('open');});render();</script>
